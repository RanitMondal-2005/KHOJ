{% extends 'base.html' %}
{% block title %}Family Login{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <div class="auth-card card p-4">

                <!-- header -->
                <div class="d-flex align-items-center gap-2 mb-4">
                    <div style="width:38px;height:38px;background:#eff6ff;border-radius:9px;display:flex;align-items:center;justify-content:center;">
                        <i class="bi bi-people-fill text-primary"></i>
                    </div>
                    <div>
                        <div class="fw-semibold">Family Login</div>
                        <div class="text-muted" style="font-size:0.75rem;">Enter your email and password</div>
                    </div>
                </div>
                <!-- Login form for Family -->
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        {{ form.username }}
                        
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        {{ form.password }}
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 btn-lg fw-semibold">
                        Sign In
                    </button>
                </form>
                <!-- Footer for going back or switching accounts -->
                <hr class="my-3">
                <div class="text-center">
                    <a href="{% url 'login' %}" class="text-muted small">
                        <i class="bi bi-arrow-left me-1"></i>Back to login options
                    </a>
                </div>
                <p class="text-center text-muted small mt-2 mb-0">
                    No account? <a href="{% url 'register_family' %}">Register as Family</a>
                </p>

            </div>
        </div>
    </div>
</div>
{% endblock %}
